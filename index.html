<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio | Editor de Vídeo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #fff; font-family: sans-serif; padding: 20px; }
    header { text-align: center; padding: 40px 0; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    p { color: #aaa; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .video-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .info { padding: 15px; }
  </style>
</head>
<body>

  <header>
    <h1>Seu Nome Aqui</h1>
    <p>Editor de Vídeo | Criador de Conteúdo</p>
  </header>

  <main class="grid">
    <!-- Vídeo 1 -->
    <div class="video-card">
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/SEU_VIDEO_ID" allowfullscreen></iframe>
      </div>
      <div class="info">
        <h3>Nome do Projeto 1</h3>
      </div>
    </div>

    <!-- Vídeo 2 -->
    <div class="video-card">
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/SEU_VIDEO_ID" allowfullscreen></iframe>
      </div>
      <div class="info">
        <h3>Nome do Projeto 2</h3>
      </div>
    </div>
  </main>

</body>
</html>
